name: Update e-ink daily signal

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-eink-daily
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate signal
        run: python cloud/generate_daily.py
      - name: Test generator
        run: python -m unittest discover -s cloud -p 'test_*.py'
      - name: Publish changed signal
        run: |
          if git diff --quiet -- public/daily.json; then
            echo "Signal is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/daily.json
          git commit -m "Update e-ink daily signal"
          git push
